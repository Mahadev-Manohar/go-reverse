
services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    image: goreverse-proxy
    container_name: goreverse-proxy
    ports:
      - "8080:8080"
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped

  backend-1:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: goreverse-backend
    container_name: goreverse-backend-1
    command: ["-port", "9001", "-name", "backend-1"]
    expose:
      - "9001"
    restart: unless-stopped

  backend-2:
    image: goreverse-backend
    container_name: goreverse-backend-2
    command: ["-port", "9002", "-name", "backend-2"]
    expose:
      - "9002"
    restart: unless-stopped

  backend-3:
    image: goreverse-backend
    container_name: goreverse-backend-3
    command: ["-port", "9003", "-name", "backend-3"]
    expose:
      - "9003"
    restart: unless-stopped
